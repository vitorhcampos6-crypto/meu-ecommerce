<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Pagamento - Meu E-commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="logo">Meu E-commerce</a>
            <nav>
                <a href="index.html">Início</a>
                <a href="carrinho.html">Carrinho 🛒</a>
                <a href="cadastro.html" class="active">Entrar/Cadastrar</a>
            </nav>
        </div>
    </header>

    <main class="container text-container">
        <h2>Finalizar Compra: Cadastro e Checkout</h2>
        
 
        <form action="#" method="POST" class="checkout-form">
            
        
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: João Silva" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="nome@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="form-group">
                    <label for="tel">Telefone/WhatsApp:</label>
                    <input type="tel" id="tel" name="tel" placeholder="(11) 99999-9999" required>
                </div>

                <div class="form-group">
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha de Acesso:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>

                <div class="form-group">
                    <label for="avatar">Foto de Perfil (Opcional):</label>
                    <input type="file" id="avatar" name="avatar" accept="image/*">
                </div>
            </fieldset>

            <fieldset>
                <legend>Endereço de Entrega</legend>

                <div class="form-group">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                </div>

                <div class="form-group">
                    <label for="rua">Rua/Logradouro:</label>
                    <input type="text" id="rua" name="rua" required>
                </div>

                <div class="form-group">
                    <label for="numero">Número:</label>
                    <input type="text" id="numero" name="numero" required>
                </div>

                <div class="form-group">
                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco, etc.">
                </div>

                <div class="form-group">
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" name="bairro" required>
                </div>

                <div class="form-group">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>

                <div class="form-group">
                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione...</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                     
                    </select>
                </div>
            </fieldset>

          
            <fieldset>
                <legend>Forma de Pagamento</legend>
                <div class="payment-options">
                    <label class="payment-label">
                        <input type="radio" name="pagamento" value="pix" required>
                        <span class="payment-box">
                            <span class="icon">🔹</span> PIX (Aprovação imediata)
                        </span>
                    </label>

                    <label class="payment-label">
                        <input type="radio" name="pagamento" value="cartao" required>
                        <span class="payment-box">
                            <span class="icon">💳</span> Cartão de Crédito
                        </span>
                    </label>

                    <label class="payment-label">
                        <input type="radio" name="pagamento" value="boleto" required>
                        <span class="payment-box">
                            <span class="icon">📄</span> Boleto Bancário
                        </span>
                    </label>
                </div>
            </fieldset>

          
            <div class="terms-container">
                <label for="termos">
                    <input type="checkbox" id="termos" name="termos" required>
                    Li e aceito os Termos de Uso e Políticas da loja.
                </label>
            </div>

            <button type="submit" class="btn-submit">Concluir Cadastro e Pagar</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Meu E-commerce. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
